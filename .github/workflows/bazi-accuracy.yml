# The accuracy gate.
#
# Katon's readings are only as good as its solar-term boundaries: a 節 on the
# wrong day gives someone the wrong Month Branch, which changes 得令 and with it
# the whole reading. Adopting tyme4ts made that a dependency question, and this
# workflow is what turns "do I trust it?" into "did it change?" — answered on
# every push, in about a second.
#
# scripts/oracle-sxtwl.py is deliberately NOT here: it needs a Python toolchain,
# and it checks port fidelity rather than correctness. Run it by hand when
# bumping tyme4ts.
name: bazi-accuracy

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # 1,212 節 boundaries 1930-2030 vs an independent ephemeris, plus the
      # Hong Kong Observatory published tables. Fails on any +08 date
      # disagreement.
      - name: Solar-term regression lock
        run: npm run test:solar-terms

      # The 13-chart Joey Yap fixture: pillars, Ten Gods, no-hour stability.
      - name: Engine validation report
        run: npm run test:engine

      # Locks the naive-wall-clock convention and the 流派2 provider.
      - name: Time-convention lock
        run: npm run test:pillars

      # Fixture-shape lock for Joey's full ten bars. Catches a transcription slip
      # in a new row before any model is fitted to it.
      - name: Joey bar fixture shape
        run: npm run test:joey-bars

      # The 藏干 table. An error here is an error in every derived fact at once —
      # 子 was wrong as 壬 for the whole build and cost a measurement cycle.
      - name: Hidden-stem table lock
        run: npm run test:hidden-stems

      # Independent day-pillar cross-check (astronomia) + Reyner's chart.
      - name: Day-pillar cross-check
        run: npm run test:bazi

      # Paywall fail-closed fence + webhook idempotency.
      - name: Paywall forge tests
        run: npm run test:forge

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npx eslint .
        continue-on-error: true # pre-existing errors in scripts/build-content.mjs
